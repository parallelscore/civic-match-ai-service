name: Check Secrets

on:
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check which secrets are empty
        run: |
          echo "Checking secrets..."
          
          # Check each secret - will show "empty" or "has_value" without revealing the actual value
          [ -z "${{ secrets.DEV_POSTGRESQL_DATABASE_URL }}" ] && echo "❌ DEV_POSTGRESQL_DATABASE_URL is EMPTY" || echo "✅ DEV_POSTGRESQL_DATABASE_URL has value"
          [ -z "${{ secrets.DEV_REDIS_DATABASE_URL }}" ] && echo "❌ DEV_REDIS_DATABASE_URL is EMPTY" || echo "✅ DEV_REDIS_DATABASE_URL has value"
          [ -z "${{ secrets.DEV_CACHE_TTL_SECONDS }}" ] && echo "❌ DEV_CACHE_TTL_SECONDS is EMPTY" || echo "✅ DEV_CACHE_TTL_SECONDS has value"
          [ -z "${{ secrets.DEV_BACKEND_API_URL }}" ] && echo "❌ DEV_BACKEND_API_URL is EMPTY" || echo "✅ DEV_BACKEND_API_URL has value"
          [ -z "${{ secrets.USE_MOCK_BACKEND_API_URL }}" ] && echo "❌ USE_MOCK_BACKEND_API_URL is EMPTY" || echo "✅ USE_MOCK_BACKEND_API_URL has value"
          [ -z "${{ secrets.DEV_MOCK_BACKEND_API_URL }}" ] && echo "❌ DEV_MOCK_BACKEND_API_URL is EMPTY" || echo "✅ DEV_MOCK_BACKEND_API_URL has value"
          [ -z "${{ secrets.DEV_OPENAI_API_KEY }}" ] && echo "❌ DEV_OPENAI_API_KEY is EMPTY" || echo "✅ DEV_OPENAI_API_KEY has value"
          [ -z "${{ secrets.DEV_LLM_PROVIDER }}" ] && echo "❌ DEV_LLM_PROVIDER is EMPTY" || echo "✅ DEV_LLM_PROVIDER has value"
          [ -z "${{ secrets.DEV_LLM_MODEL }}" ] && echo "❌ DEV_LLM_MODEL is EMPTY" || echo "✅ DEV_LLM_MODEL has value"
          [ -z "${{ secrets.DEV_LLM_MAX_TOKENS }}" ] && echo "❌ DEV_LLM_MAX_TOKENS is EMPTY" || echo "✅ DEV_LLM_MAX_TOKENS has value"
          [ -z "${{ secrets.DEV_LLM_TEMPERATURE }}" ] && echo "❌ DEV_LLM_TEMPERATURE is EMPTY" || echo "✅ DEV_LLM_TEMPERATURE has value"
          [ -z "${{ secrets.DEV_LLM_TIMEOUT_SECONDS }}" ] && echo "❌ DEV_LLM_TIMEOUT_SECONDS is EMPTY" || echo "✅ DEV_LLM_TIMEOUT_SECONDS has value"
          [ -z "${{ secrets.DEV_LLM_RETRY_ATTEMPTS }}" ] && echo "❌ DEV_LLM_RETRY_ATTEMPTS is EMPTY" || echo "✅ DEV_LLM_RETRY_ATTEMPTS has value"
          [ -z "${{ secrets.DEV_EMBEDDING_MODEL }}" ] && echo "❌ DEV_EMBEDDING_MODEL is EMPTY" || echo "✅ DEV_EMBEDDING_MODEL has value"
          [ -z "${{ secrets.DEV_EMBEDDING_SIMILARITY_THRESHOLD }}" ] && echo "❌ DEV_EMBEDDING_SIMILARITY_THRESHOLD is EMPTY" || echo "✅ DEV_EMBEDDING_SIMILARITY_THRESHOLD has value"
          [ -z "${{ secrets.DEV_ENABLE_LLM_MATCHING }}" ] && echo "❌ DEV_ENABLE_LLM_MATCHING is EMPTY" || echo "✅ DEV_ENABLE_LLM_MATCHING has value"
          [ -z "${{ secrets.DEV_ENABLE_SEMANTIC_MATCHING }}" ] && echo "❌ DEV_ENABLE_SEMANTIC_MATCHING is EMPTY" || echo "✅ DEV_ENABLE_SEMANTIC_MATCHING has value"
          [ -z "${{ secrets.DEV_AI_SERVICE_API_URL }}" ] && echo "❌ DEV_AI_SERVICE_API_URL is EMPTY" || echo "✅ DEV_AI_SERVICE_API_URL has value"
          
          echo ""
          echo "Note: This only checks if secrets are defined. Empty secrets will show as EMPTY."
