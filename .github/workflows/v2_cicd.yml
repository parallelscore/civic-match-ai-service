name: V2 CICD

# Triggers only on the V2 feature branch.
# The existing dev_cicd.yml (V1) triggers on 'dev' and is completely unaffected.

on:
  workflow_dispatch:

  push:
    branches:
      - 'feature/v2-matching-engine-refactor'

  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - 'feature/v2-matching-engine-refactor'

env:
  ENV: dev

jobs:

  build-docker-image:
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.vars.outputs.image-tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build (but not push) Docker image
        # Image is tagged :v2 so it sits alongside the existing :dev (V1) image
        # in Docker Hub without overwriting it.
        id: vars
        uses: docker/build-push-action@v4
        with:
          push: false
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:v2
          load: true
          build-args: |
            POSTGRESQL_DATABASE_URL=${{ secrets.DEV_POSTGRESQL_DATABASE_URL }}
            REDIS_DATABASE_URL=${{ secrets.DEV_REDIS_DATABASE_URL }}
            CACHE_TTL_SECONDS=${{ secrets.DEV_CACHE_TTL_SECONDS }}
            BACKEND_API_URL=${{ secrets.DEV_BACKEND_API_URL }}
            USE_MOCK_BACKEND_API_URL=${{ secrets.USE_MOCK_BACKEND_API_URL }}
            MOCK_BACKEND_API_URL=${{ secrets.DEV_MOCK_BACKEND_API_URL }}
            OPENAI_API_KEY=${{ secrets.DEV_OPENAI_API_KEY }}
            LLM_PROVIDER=${{ secrets.DEV_LLM_PROVIDER }}
            LLM_MODEL=${{ secrets.DEV_LLM_MODEL }}
            LLM_MAX_TOKENS=${{ secrets.DEV_LLM_MAX_TOKENS }}
            LLM_TEMPERATURE=${{ secrets.DEV_LLM_TEMPERATURE }}
            LLM_TIMEOUT_SECONDS=${{ secrets.DEV_LLM_TIMEOUT_SECONDS }}
            LLM_RETRY_ATTEMPTS=${{ secrets.DEV_LLM_RETRY_ATTEMPTS }}
            EMBEDDING_MODEL=${{ secrets.DEV_EMBEDDING_MODEL }}
            EMBEDDING_SIMILARITY_THRESHOLD=${{ secrets.DEV_EMBEDDING_SIMILARITY_THRESHOLD }}
            ENABLE_LLM_MATCHING=${{ secrets.DEV_ENABLE_LLM_MATCHING }}
            ENABLE_SEMANTIC_MATCHING=${{ secrets.DEV_ENABLE_SEMANTIC_MATCHING }}
            AI_SERVICE_API_URL=${{ secrets.DEV_AI_SERVICE_API_URL }}
            DEBUG_MODE=false

  push-docker-image:
    needs: [ build-docker-image ]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image tagged :v2
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:v2
          build-args: |
            POSTGRESQL_DATABASE_URL=${{ secrets.DEV_POSTGRESQL_DATABASE_URL }}
            REDIS_DATABASE_URL=${{ secrets.DEV_REDIS_DATABASE_URL }}
            CACHE_TTL_SECONDS=${{ secrets.DEV_CACHE_TTL_SECONDS }}
            BACKEND_API_URL=${{ secrets.DEV_BACKEND_API_URL }}
            USE_MOCK_BACKEND_API_URL=${{ secrets.USE_MOCK_BACKEND_API_URL }}
            MOCK_BACKEND_API_URL=${{ secrets.DEV_MOCK_BACKEND_API_URL }}
            OPENAI_API_KEY=${{ secrets.DEV_OPENAI_API_KEY }}
            LLM_PROVIDER=${{ secrets.DEV_LLM_PROVIDER }}
            LLM_MODEL=${{ secrets.DEV_LLM_MODEL }}
            LLM_MAX_TOKENS=${{ secrets.DEV_LLM_MAX_TOKENS }}
            LLM_TEMPERATURE=${{ secrets.DEV_LLM_TEMPERATURE }}
            LLM_TIMEOUT_SECONDS=${{ secrets.DEV_LLM_TIMEOUT_SECONDS }}
            LLM_RETRY_ATTEMPTS=${{ secrets.DEV_LLM_RETRY_ATTEMPTS }}
            EMBEDDING_MODEL=${{ secrets.DEV_EMBEDDING_MODEL }}
            EMBEDDING_SIMILARITY_THRESHOLD=${{ secrets.DEV_EMBEDDING_SIMILARITY_THRESHOLD }}
            ENABLE_LLM_MATCHING=${{ secrets.DEV_ENABLE_LLM_MATCHING }}
            ENABLE_SEMANTIC_MATCHING=${{ secrets.DEV_ENABLE_SEMANTIC_MATCHING }}
            AI_SERVICE_API_URL=${{ secrets.DEV_AI_SERVICE_API_URL }}
            DEBUG_MODE=false

  deploy-to-kubernetes:
    needs: push-docker-image
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Install and configure kubectl
        run: |
          curl -LO "https://storage.googleapis.com/kubernetes-release/release/$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl
          echo "${{ secrets.ELECTED_K8_KUBECONFIG }}" | base64 --decode > kubeconfig.yaml

      - name: Create or update V2 deployment in Kubernetes
        # This step is self-contained:
        #   - If the V2 deployment does NOT exist → it creates it from scratch
        #   - If the V2 deployment ALREADY exists → it updates the image tag and restarts it
        # V1 deployment (DEV_DEPLOYMENT_NAME) is never referenced or touched.
        # DEV_V2_DEPLOYMENT_NAME is the only new secret needed (e.g. "civic-match-ai-v2").
        run: |
          export KUBECONFIG=kubeconfig.yaml
          V2_DEPLOYMENT=${{ secrets.DEV_V2_DEPLOYMENT_NAME }}
          V2_NAMESPACE=${{ secrets.DEV_NAMESPACE }}
          V2_IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:v2

          # Check if the V2 deployment already exists
          if KUBECONFIG=kubeconfig.yaml kubectl get deployment "$V2_DEPLOYMENT" -n "$V2_NAMESPACE" > /dev/null 2>&1; then
            echo "✅ V2 deployment exists — updating image to $V2_IMAGE"
            KUBECONFIG=kubeconfig.yaml kubectl set image deployment/"$V2_DEPLOYMENT" \
              "$V2_DEPLOYMENT"="$V2_IMAGE" \
              -n "$V2_NAMESPACE"
            KUBECONFIG=kubeconfig.yaml kubectl rollout restart deployment/"$V2_DEPLOYMENT" -n "$V2_NAMESPACE"
          else
            echo "🚀 V2 deployment does not exist — creating it now"
            # Create the deployment manifest inline — mirrors V1 structure
            # but uses the :v2 image tag and a separate deployment name.
            cat <<EOF | KUBECONFIG=kubeconfig.yaml kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: $V2_DEPLOYMENT
            namespace: $V2_NAMESPACE
            labels:
              app: $V2_DEPLOYMENT
              version: v2
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: $V2_DEPLOYMENT
            template:
              metadata:
                labels:
                  app: $V2_DEPLOYMENT
                  version: v2
              spec:
                containers:
                  - name: $V2_DEPLOYMENT
                    image: $V2_IMAGE
                    imagePullPolicy: Always
                    ports:
                      - containerPort: 8000
                    env:
                      - name: POSTGRESQL_DATABASE_URL
                        value: "${{ secrets.DEV_POSTGRESQL_DATABASE_URL }}"
                      - name: REDIS_DATABASE_URL
                        value: "${{ secrets.DEV_REDIS_DATABASE_URL }}"
                      - name: CACHE_TTL_SECONDS
                        value: "${{ secrets.DEV_CACHE_TTL_SECONDS }}"
                      - name: BACKEND_API_URL
                        value: "${{ secrets.DEV_BACKEND_API_URL }}"
                      - name: USE_MOCK_BACKEND_API_URL
                        value: "${{ secrets.USE_MOCK_BACKEND_API_URL }}"
                      - name: MOCK_BACKEND_API_URL
                        value: "${{ secrets.DEV_MOCK_BACKEND_API_URL }}"
                      - name: OPENAI_API_KEY
                        value: "${{ secrets.DEV_OPENAI_API_KEY }}"
                      - name: LLM_PROVIDER
                        value: "${{ secrets.DEV_LLM_PROVIDER }}"
                      - name: LLM_MODEL
                        value: "${{ secrets.DEV_LLM_MODEL }}"
                      - name: LLM_MAX_TOKENS
                        value: "${{ secrets.DEV_LLM_MAX_TOKENS }}"
                      - name: LLM_TEMPERATURE
                        value: "${{ secrets.DEV_LLM_TEMPERATURE }}"
                      - name: LLM_TIMEOUT_SECONDS
                        value: "${{ secrets.DEV_LLM_TIMEOUT_SECONDS }}"
                      - name: LLM_RETRY_ATTEMPTS
                        value: "${{ secrets.DEV_LLM_RETRY_ATTEMPTS }}"
                      - name: EMBEDDING_MODEL
                        value: "${{ secrets.DEV_EMBEDDING_MODEL }}"
                      - name: EMBEDDING_SIMILARITY_THRESHOLD
                        value: "${{ secrets.DEV_EMBEDDING_SIMILARITY_THRESHOLD }}"
                      - name: ENABLE_LLM_MATCHING
                        value: "${{ secrets.DEV_ENABLE_LLM_MATCHING }}"
                      - name: ENABLE_SEMANTIC_MATCHING
                        value: "${{ secrets.DEV_ENABLE_SEMANTIC_MATCHING }}"
                      - name: AI_SERVICE_API_URL
                        value: "${{ secrets.DEV_AI_SERVICE_API_URL }}"
                      - name: DEBUG_MODE
                        value: "false"
          EOF
            echo "✅ V2 deployment created successfully"
          fi

          # Wait for the rollout to complete
          KUBECONFIG=kubeconfig.yaml kubectl rollout status deployment/"$V2_DEPLOYMENT" \
            -n "$V2_NAMESPACE" \
            --timeout=120s

      - name: Apply V2 Service and update shared Ingress for path-based routing
        # V2 is exposed via path-based routing on the existing ai-civicmatch.electeddc.org domain:
        #   /api/v1/* → V1 service (elected-ai-service-development)
        #   /api/v2/* → V2 service (civic-match-ai-v2-service)
        # Both apps handle their own path prefixes internally (/api/v1 and /api/v2),
        # so no nginx rewrite is needed — full paths are passed through as-is.
        # No new DNS record or TLS cert is required —
        # the existing elected-ai-service-development-secret is reused.
        # This step is idempotent and safe to re-run on every deploy.
        run: |
          export KUBECONFIG=kubeconfig.yaml
          V2_DEPLOYMENT=${{ secrets.DEV_V2_DEPLOYMENT_NAME }}
          V2_NAMESPACE=${{ secrets.DEV_NAMESPACE }}

          # 1. Ensure the V2 ClusterIP Service exists
          cat <<EOF | KUBECONFIG=kubeconfig.yaml kubectl apply -f -
          apiVersion: v1
          kind: Service
          metadata:
            name: ${V2_DEPLOYMENT}-service
            namespace: $V2_NAMESPACE
            labels:
              app: $V2_DEPLOYMENT
              version: v2
          spec:
            type: ClusterIP
            selector:
              app: $V2_DEPLOYMENT
            ports:
              - name: http
                port: 8000
                targetPort: 8000
          EOF

          # 2. Update the shared ingress to route /api/v1 → V1 and /api/v2 → V2
          cat <<EOF | KUBECONFIG=kubeconfig.yaml kubectl apply -f -
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: elected-ai-service-development
            namespace: $V2_NAMESPACE
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-production
              nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
          spec:
            ingressClassName: nginx
            tls:
              - hosts:
                  - ai-civicmatch.electeddc.org
                secretName: elected-ai-service-development-secret
            rules:
              - host: ai-civicmatch.electeddc.org
                http:
                  paths:
                    - path: /api/v1
                      pathType: Prefix
                      backend:
                        service:
                          name: ${{ secrets.DEV_DEPLOYMENT_NAME }}-service
                          port:
                            number: 8000
                    - path: /api/v2
                      pathType: Prefix
                      backend:
                        service:
                          name: ${V2_DEPLOYMENT}-service
                          port:
                            number: 8000
          EOF
          echo "✅ V2 Service and shared Ingress applied"
          echo "   V1 → https://ai-civicmatch.electeddc.org/api/v1"
          echo "   V2 → https://ai-civicmatch.electeddc.org/api/v2"
